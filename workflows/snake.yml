name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dharshan-01
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300C9A7&color_dots=%230D1117%2300332E%23006658%2300A88F%2300C9A7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F5D4&color_dots=%230D1117%2300332E%23006658%2300A88F%2300F5D4

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
